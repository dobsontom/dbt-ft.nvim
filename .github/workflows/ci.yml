name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so a new Jinja or SQL grammar that breaks the queries fails here
    # before users hit it.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Run StyLua
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: --check .
          version: 2.6.0

      - name: Install selene
        run: |
          curl -fsSL -o "$RUNNER_TEMP/selene.zip" \
            https://github.com/Kampfkarren/selene/releases/download/0.32.0/selene-0.32.0-linux.zip
          unzip -q "$RUNNER_TEMP/selene.zip" -d "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/selene" /usr/local/bin/selene

      - name: Run selene
        run: selene .

      - name: Run ShellCheck
        run: shellcheck scripts/test

      - name: Run oxfmt
        run: npx --yes oxfmt@latest --check

  release:
    name: Release
    permissions:
      contents: write
      issues: write
      pull-requests: write
    needs: [lint, test, typecheck]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v5
        with:
          release-type: simple

  test:
    name: Test on Neovim ${{ matrix.nvim }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        nvim: [v0.12.0, stable, nightly]
      fail-fast: false
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          version: ${{ matrix.nvim }}
          neovim: true
        # Fails on the 26.04 runner without it (rhysd/action-setup-vim#80).
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Install the Tree-sitter CLI
        uses: tree-sitter/setup-action/cli@v2

      - name: Run the tests
        run: scripts/test

  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # The oldest supported Neovim, so each call must match its signatures.
      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          version: v0.12.0
          neovim: true
        # Fails on the 26.04 runner without it (rhysd/action-setup-vim#80).
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Install lua-language-server
        run: |
          mkdir "$RUNNER_TEMP/luals"
          curl -fsSL https://github.com/LuaLS/lua-language-server/releases/download/3.19.2/lua-language-server-3.19.2-linux-x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/luals"
          echo "$RUNNER_TEMP/luals/bin" >> "$GITHUB_PATH"

      - name: Run lua-language-server
        run: |
          VIMRUNTIME=$(nvim --clean --headless --cmd 'lua io.write(vim.env.VIMRUNTIME)' --cmd 'qa!') \
            lua-language-server --check . --checklevel=Warning
