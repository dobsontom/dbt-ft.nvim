name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so a new Jinja or SQL grammar that breaks the queries fails here
    # before users hit it.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check on Neovim ${{ matrix.nvim }}
    # Read-only, as the lint runs each tool's latest release unreviewed.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        nvim: [v0.12.0, stable, nightly]
      fail-fast: false
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          version: ${{ matrix.nvim }}
          neovim: true
        # Fails on the 26.04 runner without it (rhysd/action-setup-vim#80).
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Install the Tree-sitter CLI
        uses: tree-sitter/setup-action/cli@v2

      # The oldest supported Neovim also lints, so each call must match its
      # signatures.
      - name: Install the tools
        if: matrix.nvim == 'v0.12.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP" || exit
          get() { gh release download --repo "$1" --pattern "$2"; }
          get JohnnyMorganz/StyLua 'stylua-linux-x86_64.zip' && unzip -q stylua-*.zip
          get Kampfkarren/selene 'selene-[0-9]*-linux.zip' && unzip -q selene-*.zip
          get ribru17/ts_query_ls 'ts_query_ls-x86_64-unknown-linux-gnu.tar.gz' && tar -xzf ts_query_ls-*.tar.gz
          get LuaLS/lua-language-server 'lua-language-server-*-linux-x64.tar.gz' &&
            mkdir luals && tar -xzf lua-language-server-*.tar.gz -C luals
          chmod +x stylua selene
          printf '%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP/luals/bin" >>"$GITHUB_PATH"
          npm install --global --silent oxfmt@latest

      - name: Run prek
        if: matrix.nvim == 'v0.12.0'
        uses: j178/prek-action@v3.1.0

      - name: Run the tests
        if: matrix.nvim != 'v0.12.0'
        run: make test

  release:
    name: Release
    permissions:
      contents: write
      issues: write
      pull-requests: write
    needs: [check]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v5
        with:
          release-type: simple
