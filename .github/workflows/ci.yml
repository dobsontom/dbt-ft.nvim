name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a new jinja or sql grammar that breaks the queries fails here
    # before users hit it.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.6.0
          args: --check .
      - name: selene
        run: |
          curl -fsSL -o "$RUNNER_TEMP/selene.zip" \
            https://github.com/Kampfkarren/selene/releases/download/0.32.0/selene-0.32.0-linux.zip
          unzip -q "$RUNNER_TEMP/selene.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/selene"
          "$RUNNER_TEMP/selene" .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The oldest supported Neovim, so calling anything newer fails the check.
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.0
      - name: lua-language-server
        run: |
          mkdir "$RUNNER_TEMP/luals"
          curl -fsSL https://github.com/LuaLS/lua-language-server/releases/download/3.19.2/lua-language-server-3.19.2-linux-x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/luals"
          VIMRUNTIME=$(nvim --clean --headless --cmd 'lua io.write(vim.env.VIMRUNTIME)' --cmd 'qa!') \
            "$RUNNER_TEMP/luals/bin/lua-language-server" --check . --checklevel=Warning

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nvim: [v0.12.0, stable, nightly]
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      - uses: tree-sitter/setup-action/cli@v2
      - run: scripts/test
