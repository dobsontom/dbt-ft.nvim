# The Makefile owns which tools run, so these hooks only decide when.

[priorities]
whitespace = 0
eof = 1
format = 2
lint = 3

[[repos]]
repo = "builtin"

# Fixtures are test inputs, kept byte for byte.
[[repos.hooks]]
id = "trailing-whitespace"
priority = "whitespace"
args = ["--markdown-linebreak-ext=md"]
exclude = '^tests/fixtures/'

[[repos.hooks]]
id = "end-of-file-fixer"
priority = "eof"
exclude = '^tests/fixtures/'

[[repos.hooks]]
id = "check-added-large-files"
priority = "lint"

[[repos.hooks]]
id = "check-case-conflict"
priority = "lint"

[[repos.hooks]]
id = "check-executables-have-shebangs"
priority = "lint"

[[repos.hooks]]
id = "check-json"
priority = "lint"

[[repos.hooks]]
id = "check-merge-conflict"
priority = "lint"

[[repos.hooks]]
id = "check-shebang-scripts-are-executable"
priority = "lint"

[[repos.hooks]]
id = "check-toml"
priority = "lint"

[[repos.hooks]]
id = "check-yaml"
priority = "lint"

[[repos.hooks]]
id = "detect-private-key"
priority = "lint"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "format"
priority = "format"
name = "make format"
language = "system"
entry = "make format"
pass_filenames = false

# One make run, so a fresh clone builds the parsers once. Neither target
# reads Markdown.
[[repos.hooks]]
id = "lint-test"
priority = "lint"
name = "make lint test"
language = "system"
entry = "make lint test"
exclude = '\.md$'
pass_filenames = false
