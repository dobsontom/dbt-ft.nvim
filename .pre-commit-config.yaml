# The Makefile owns which tools run and fetches them, so these hooks only
# decide when. Hooks sharing a priority run concurrently, lowest first.

priorities:
  whitespace: 0
  eof: 1
  format: 2
  lint: 3

repos:
  - repo: builtin
    hooks:
      # Fixtures are test inputs, kept byte for byte.
      - id: trailing-whitespace
        priority: whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^tests/fixtures/
      - id: end-of-file-fixer
        priority: eof
        exclude: ^tests/fixtures/
      - id: check-added-large-files
        priority: lint
      - id: check-case-conflict
        priority: lint
      - id: check-executables-have-shebangs
        priority: lint
      - id: check-json
        priority: lint
      - id: check-merge-conflict
        priority: lint
      - id: check-shebang-scripts-are-executable
        priority: lint
      - id: check-toml
        priority: lint
      - id: check-yaml
        priority: lint
      - id: detect-private-key
        priority: lint

  - repo: local
    hooks:
      - id: format
        priority: format
        name: make format
        language: system
        entry: make format
        pass_filenames: false
      # One make run, so a fresh clone builds the parsers once. Neither target
      # reads Markdown.
      - id: lint-test
        priority: lint
        name: make lint test
        language: system
        entry: make lint test
        exclude: \.md$
        pass_filenames: false
